<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Neon Breakout</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #09090c;
    color: white;
    min-height: 100vh;
}


/* NAVBAR */

.navbar {
    height: 70px;

    background: #111116;

    border-bottom: 1px solid #292930;

    display: flex;
    align-items: center;

    padding: 0 30px;
}

.logo {
    font-size: 23px;
    font-weight: bold;
}

.logo span {
    color: #8b5cf6;
}

.home-button {
    margin-left: auto;

    background: #202027;

    border: 1px solid #35353d;

    color: white;

    padding: 10px 18px;

    border-radius: 7px;

    cursor: pointer;

    font-size: 14px;
}

.home-button:hover {
    background: #8b5cf6;
}


/* MAIN */

.container {
    max-width: 850px;

    margin: auto;

    padding: 30px 20px;

    text-align: center;
}

h1 {
    font-size: 36px;

    margin-bottom: 5px;
}

.subtitle {
    color: #888;

    margin-bottom: 20px;
}


/* SCORE */

.score-box {
    display: flex;

    justify-content: center;

    gap: 15px;

    margin-bottom: 20px;
}

.score {
    background: #15151b;

    border: 1px solid #292930;

    border-radius: 8px;

    padding: 10px 20px;

    min-width: 110px;
}

.score-title {
    color: #777;

    font-size: 12px;

    margin-bottom: 3px;
}

.score-number {
    font-size: 22px;

    font-weight: bold;
}


/* GAME */

.game-wrapper {
    display: flex;

    justify-content: center;
}

canvas {
    background: #08080c;

    border: 2px solid #292930;

    border-radius: 10px;

    max-width: 100%;

    box-shadow:
        0 0 30px rgba(139, 92, 246, 0.12);
}


/* BUTTONS */

.controls {
    display: flex;

    justify-content: center;

    gap: 10px;

    margin-top: 20px;
}

.control-button {
    background: #202027;

    border: 1px solid #35353d;

    color: white;

    padding: 10px 20px;

    border-radius: 7px;

    cursor: pointer;
}

.control-button:hover {
    background: #8b5cf6;
}


/* MESSAGE */

.message {
    color: #aaa;

    min-height: 25px;

    margin-top: 15px;
}


/* MOBILE */

@media (max-width: 650px) {

    .navbar {
        padding: 0 15px;
    }

    h1 {
        font-size: 30px;
    }

    canvas {
        width: 100%;

        height: auto;
    }

}

</style>

</head>


<body>


<!-- NAVBAR -->

<nav class="navbar">

    <div class="logo">
        🎮 <span>Game</span> Hub
    </div>

    <button
        class="home-button"
        onclick="goHome()"
    >
        ← Game Hub
    </button>

</nav>



<!-- GAME -->

<main class="container">

    <h1>
        🧱 Neon Breakout
    </h1>

    <p class="subtitle">
        Break every block and beat the level.
    </p>


    <!-- SCORE -->

    <div class="score-box">

        <div class="score">

            <div class="score-title">
                SCORE
            </div>

            <div
                class="score-number"
                id="score"
            >
                0
            </div>

        </div>


        <div class="score">

            <div class="score-title">
                LIVES
            </div>

            <div
                class="score-number"
                id="lives"
            >
                3
            </div>

        </div>


        <div class="score">

            <div class="score-title">
                HIGH SCORE
            </div>

            <div
                class="score-number"
                id="highScore"
            >
                0
            </div>

        </div>

    </div>


    <!-- CANVAS -->

    <div class="game-wrapper">

        <canvas
            id="gameCanvas"
            width="800"
            height="600"
        ></canvas>

    </div>


    <!-- BUTTONS -->

    <div class="controls">

        <button
            class="control-button"
            onclick="startGame()"
        >
            Start Game
        </button>

        <button
            class="control-button"
            onclick="restartGame()"
        >
            Restart
        </button>

    </div>


    <div
        class="message"
        id="message"
    >
        Use A/D or Arrow Keys to move the paddle.
    </div>


</main>



<script>


/* =========================
   GAME HUB
========================= */

function goHome() {

    window.location.href =
        "https://game-hub.jakejmanz.workers.dev/";

}



/* =========================
   CANVAS
========================= */

const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");


/* =========================
   GAME SETTINGS
========================= */

const paddleWidth = 110;

const paddleHeight = 14;

const ballSize = 12;

const brickRows = 5;

const brickColumns = 9;

const brickWidth = 75;

const brickHeight = 22;

const brickPadding = 10;

const brickTop = 70;

const brickLeft =
    (
        canvas.width -
        (
            brickColumns *
            (
                brickWidth +
                brickPadding
            )
        ) +
        brickPadding
    ) / 2;


/* =========================
   PADDLE
========================= */

let paddle = {

    x:
        canvas.width / 2 -
        paddleWidth / 2,

    y:
        canvas.height - 45,

    width:
        paddleWidth,

    height:
        paddleHeight,

    speed:
        8

};


/* =========================
   BALL
========================= */

let ball = {

    x:
        canvas.width / 2,

    y:
        canvas.height - 70,

    size:
        ballSize,

    speedX:
        5,

    speedY:
        -5

};


/* =========================
   BRICKS
========================= */

let bricks = [];


/* =========================
   GAME VARIABLES
========================= */

let score = 0;

let lives = 3;

let highScore =
    Number(
        localStorage.getItem(
            "breakoutHighScore"
        )
    ) || 0;

let gameRunning = false;

let gameOver = false;

let animation;

let moveLeftPressed = false;

let moveRightPressed = false;


/* =========================
   HIGH SCORE
========================= */

document
    .getElementById("highScore")
    .textContent =
    highScore;



/* =========================
   CREATE BRICKS
========================= */

function createBricks() {

    bricks = [];


    for (
        let row = 0;
        row < brickRows;
        row++
    ) {

        for (
            let column = 0;
            column < brickColumns;
            column++
        ) {

            bricks.push({

                x:
                    brickLeft +
                    column *
                    (
                        brickWidth +
                        brickPadding
                    ),

                y:
                    brickTop +
                    row *
                    (
                        brickHeight +
                        brickPadding
                    ),

                width:
                    brickWidth,

                height:
                    brickHeight,

                alive:
                    true,

                row:
                    row

            });

        }

    }

}



/* =========================
   START GAME
========================= */

function startGame() {

    if (gameRunning) {
        return;
    }


    if (gameOver) {

        restartGame();

    }


    gameRunning = true;

    gameOver = false;


    document
        .getElementById("message")
        .textContent =
        "Break the blocks!";


    animation =
        requestAnimationFrame(
            updateGame
        );

}



/* =========================
   RESTART
========================= */

function restartGame() {

    cancelAnimationFrame(animation);


    score = 0;

    lives = 3;

    gameRunning = false;

    gameOver = false;


    paddle.x =
        canvas.width / 2 -
        paddleWidth / 2;


    resetBall();


    createBricks();


    updateScore();


    document
        .getElementById("message")
        .textContent =
        "Use A/D or Arrow Keys to move the paddle.";


    drawGame();

}



/* =========================
   RESET BALL
========================= */

function resetBall() {

    ball.x =
        canvas.width / 2;

    ball.y =
        canvas.height - 70;


    let direction =
        Math.random() < 0.5
            ? -1
            : 1;


    ball.speedX =
        5 * direction;

    ball.speedY =
        -5;

}



/* =========================
   UPDATE GAME
========================= */

function updateGame() {

    if (!gameRunning) {
        return;
    }


    /* PADDLE */

    if (moveLeftPressed) {

        paddle.x -=
            paddle.speed;

    }


    if (moveRightPressed) {

        paddle.x +=
            paddle.speed;

    }


    /* PADDLE BOUNDARIES */

    if (paddle.x < 0) {

        paddle.x = 0;

    }


    if (
        paddle.x +
        paddle.width >
        canvas.width
    ) {

        paddle.x =
            canvas.width -
            paddle.width;

    }


    /* BALL */

    ball.x +=
        ball.speedX;

    ball.y +=
        ball.speedY;


    /* LEFT / RIGHT WALL */

    if (
        ball.x <= 0 ||
        ball.x +
        ball.size >=
        canvas.width
    ) {

        ball.speedX *= -1;

    }


    /* TOP WALL */

    if (ball.y <= 0) {

        ball.speedY *= -1;

    }


    /* PADDLE COLLISION */

    if (

        ball.x +
        ball.size >=
        paddle.x &&

        ball.x <=
        paddle.x +
        paddle.width &&

        ball.y +
        ball.size >=
        paddle.y &&

        ball.y <=
        paddle.y +
        paddle.height &&

        ball.speedY > 0

    ) {

        ball.y =
            paddle.y -
            ball.size;


        ball.speedY *= -1;


        /* Change angle depending
           on where the ball hits */

        const hitPosition =
            (
                ball.x +
                ball.size / 2 -
                (
                    paddle.x +
                    paddle.width / 2
                )
            ) /
            (
                paddle.width / 2
            );


        ball.speedX =
            hitPosition * 7;

    }


    /* BRICK COLLISION */

    for (
        let brick of bricks
    ) {

        if (!brick.alive) {
            continue;
        }


        if (

            ball.x +
            ball.size >=
            brick.x &&

            ball.x <=
            brick.x +
            brick.width &&

            ball.y +
            ball.size >=
            brick.y &&

            ball.y <=
            brick.y +
            brick.height

        ) {

            brick.alive = false;

            score += 10;

            updateScore();


            /* Work out which side
               the ball hit */

            const ballCenterX =
                ball.x +
                ball.size / 2;

            const ballCenterY =
                ball.y +
                ball.size / 2;


            const brickCenterX =
                brick.x +
                brick.width / 2;

            const brickCenterY =
                brick.y +
                brick.height / 2;


            const differenceX =
                ballCenterX -
                brickCenterX;

            const differenceY =
                ballCenterY -
                brickCenterY;


            if (
                Math.abs(differenceX) >
                Math.abs(differenceY)
            ) {

                ball.speedX *= -1;

            }

            else {

                ball.speedY *= -1;

            }


            break;

        }

    }


    /* CHECK WIN */

    const remainingBricks =
        bricks.filter(
            brick =>
                brick.alive
        ).length;


    if (
        remainingBricks === 0
    ) {

        winGame();

        return;

    }


    /* BALL FALLS */

    if (
        ball.y >
        canvas.height
    ) {

        loseLife();

        return;

    }


    /* DRAW */

    drawGame();


    animation =
        requestAnimationFrame(
            updateGame
        );

}



/* =========================
   LOSE LIFE
========================= */

function loseLife() {

    lives--;

    updateScore();


    if (lives <= 0) {

        endGame();

        return;

    }


    gameRunning = false;


    resetBall();


    document
        .getElementById("message")
        .textContent =
        "You lost a life! Press Start Game.";


    drawGame();

}



/* =========================
   WIN
========================= */

function winGame() {

    gameRunning = false;

    gameOver = true;


    cancelAnimationFrame(
        animation
    );


    if (score > highScore) {

        highScore = score;

        localStorage.setItem(
            "breakoutHighScore",
            highScore
        );

    }


    updateScore();


    document
        .getElementById("message")
        .textContent =
        "🏆 You Win! You broke every block!";

}



/* =========================
   GAME OVER
========================= */

function endGame() {

    gameRunning = false;

    gameOver = true;


    cancelAnimationFrame(
        animation
    );


    if (score > highScore) {

        highScore = score;

        localStorage.setItem(
            "breakoutHighScore",
            highScore
        );

    }


    updateScore();


    document
        .getElementById("message")
        .textContent =
        "💀 Game Over! Press Restart to try again.";

}



/* =========================
   SCORE
========================= */

function updateScore() {

    document
        .getElementById("score")
        .textContent =
        score;


    document
        .getElementById("lives")
        .textContent =
        lives;


    document
        .getElementById("highScore")
        .textContent =
        highScore;

}



/* =========================
   DRAW GAME
========================= */

function drawGame() {


    /* BACKGROUND */

    ctx.fillStyle =
        "#08080c";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* BRICKS */

    bricks.forEach(
        brick => {

            if (!brick.alive) {
                return;
            }


            const brickColors = [
                "#ef4444",
                "#f97316",
                "#eab308",
                "#22c55e",
                "#8b5cf6"
            ];


            ctx.fillStyle =
                brickColors[
                    brick.row %
                    brickColors.length
                ];


            ctx.fillRect(

                brick.x,

                brick.y,

                brick.width,

                brick.height

            );


            /* Brick shine */

            ctx.fillStyle =
                "rgba(255,255,255,0.18)";


            ctx.fillRect(

                brick.x,

                brick.y,

                brick.width,

                4

            );

        }
    );


    /* PADDLE */

    ctx.fillStyle =
        "#8b5cf6";


    ctx.fillRect(

        paddle.x,

        paddle.y,

        paddle.width,

        paddle.height

    );


    /* BALL */

    ctx.fillStyle =
        "#ffffff";


    ctx.beginPath();

    ctx.arc(

        ball.x +
        ball.size / 2,

        ball.y +
        ball.size / 2,

        ball.size / 2,

        0,

        Math.PI * 2

    );

    ctx.fill();

}



/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    function(event) {


        if (

            event.key === "ArrowLeft" ||

            event.key.toLowerCase() === "a"

        ) {

            event.preventDefault();

            moveLeftPressed = true;

        }


        if (

            event.key === "ArrowRight" ||

            event.key.toLowerCase() === "d"

        ) {

            event.preventDefault();

            moveRightPressed = true;

        }


        if (
            event.code === "Space"
        ) {

            event.preventDefault();

            startGame();

        }

    }
);


document.addEventListener(
    "keyup",
    function(event) {


        if (

            event.key === "ArrowLeft" ||

            event.key.toLowerCase() === "a"

        ) {

            moveLeftPressed = false;

        }


        if (

            event.key === "ArrowRight" ||

            event.key.toLowerCase() === "d"

        ) {

            moveRightPressed = false;

        }

    }
);



/* =========================
   INITIALIZE
========================= */

restartGame();

</script>


</body>

</html>
