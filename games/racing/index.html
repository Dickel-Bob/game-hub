<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Neon Racer</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #09090c;
    color: white;
    min-height: 100vh;
}

/* NAVBAR */

.navbar {
    height: 70px;
    background: #111116;
    border-bottom: 1px solid #292930;

    display: flex;
    align-items: center;

    padding: 0 30px;
}

.logo {
    font-size: 23px;
    font-weight: bold;
}

.logo span {
    color: #8b5cf6;
}

.home-button {
    margin-left: auto;

    background: #202027;
    border: 1px solid #35353d;

    color: white;

    padding: 10px 18px;

    border-radius: 7px;

    cursor: pointer;

    font-size: 14px;
}

.home-button:hover {
    background: #8b5cf6;
}


/* GAME AREA */

.container {
    max-width: 700px;
    margin: auto;

    padding: 30px 20px;

    text-align: center;
}

h1 {
    font-size: 36px;
    margin-bottom: 5px;
}

.subtitle {
    color: #888;
    margin-bottom: 20px;
}


/* SCORE */

.score-box {
    display: flex;
    justify-content: center;
    gap: 15px;

    margin-bottom: 20px;
}

.score {
    background: #15151b;

    border: 1px solid #292930;

    border-radius: 8px;

    padding: 10px 20px;

    min-width: 120px;
}

.score-title {
    color: #777;
    font-size: 12px;
}

.score-number {
    font-size: 22px;
    font-weight: bold;
}


/* GAME */

.game-wrapper {
    display: flex;
    justify-content: center;
}

canvas {
    background: #222;

    border: 2px solid #292930;

    border-radius: 10px;

    max-width: 100%;

    box-shadow:
        0 0 30px rgba(139, 92, 246, 0.12);
}


/* BUTTONS */

.controls {
    margin-top: 20px;

    display: flex;

    justify-content: center;

    gap: 10px;
}

.control-button {
    background: #202027;

    border: 1px solid #35353d;

    color: white;

    padding: 10px 20px;

    border-radius: 7px;

    cursor: pointer;
}

.control-button:hover {
    background: #8b5cf6;
}


/* MESSAGE */

.message {
    margin-top: 15px;

    color: #aaa;

    min-height: 25px;
}


/* MOBILE */

.mobile-controls {
    display: none;

    margin: 20px auto;

    width: 190px;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 7px;
}

.mobile-controls button {
    height: 50px;

    background: #202027;

    color: white;

    border: 1px solid #35353d;

    border-radius: 7px;

    font-size: 20px;

    cursor: pointer;
}

.mobile-controls button:hover {
    background: #8b5cf6;
}

.left {
    grid-column: 1;
}

.brake {
    grid-column: 2;
}

.right {
    grid-column: 3;
}


@media (max-width: 600px) {

    .navbar {
        padding: 0 15px;
    }

    h1 {
        font-size: 30px;
    }

    canvas {
        width: 100%;
        height: auto;
    }

    .mobile-controls {
        display: grid;
    }

}

</style>

</head>


<body>


<!-- NAVBAR -->

<nav class="navbar">

    <div class="logo">
        🎮 <span>Game</span> Hub
    </div>

    <button
        class="home-button"
        onclick="goHome()"
    >
        ← Game Hub
    </button>

</nav>



<!-- GAME -->

<main class="container">

    <h1>
        🏎️ Neon Racer
    </h1>

    <p class="subtitle">
        Dodge traffic and chase the highest distance.
    </p>


    <!-- SCORE -->

    <div class="score-box">

        <div class="score">

            <div class="score-title">
                DISTANCE
            </div>

            <div
                class="score-number"
                id="score"
            >
                0
            </div>

        </div>


        <div class="score">

            <div class="score-title">
                HIGH SCORE
            </div>

            <div
                class="score-number"
                id="highScore"
            >
                0
            </div>

        </div>

    </div>


    <!-- CANVAS -->

    <div class="game-wrapper">

        <canvas
            id="gameCanvas"
            width="500"
            height="700"
        ></canvas>

    </div>


    <!-- BUTTONS -->

    <div class="controls">

        <button
            class="control-button"
            onclick="startGame()"
        >
            Start Game
        </button>

        <button
            class="control-button"
            onclick="restartGame()"
        >
            Restart
        </button>

    </div>


    <div
        class="message"
        id="message"
    >
        Press Start Game or use A/D or Arrow Keys.
    </div>


    <!-- MOBILE CONTROLS -->

    <div class="mobile-controls">

        <button
            class="left"
            onclick="moveLeft()"
        >
            ◀
        </button>

        <button
            class="brake"
            onclick="startGame()"
        >
            ▶
        </button>

        <button
            class="right"
            onclick="moveRight()"
        >
            ▶
        </button>

    </div>


</main>



<script>


/* =========================
   GAME HUB
========================= */

function goHome() {

    window.location.href =
        "https://game-hub.jakejmanz.workers.dev/";

}



/* =========================
   CANVAS
========================= */

const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");


/* =========================
   GAME SETTINGS
========================= */

const roadWidth = 360;

const roadLeft = 70;

const roadRight =
    roadLeft + roadWidth;

const laneWidth =
    roadWidth / 3;


/* =========================
   PLAYER
========================= */

let player = {

    x: 220,

    y: 590,

    width: 45,

    height: 75,

    speed: 7

};


/* =========================
   TRAFFIC
========================= */

let traffic = [];


/* =========================
   GAME VARIABLES
========================= */

let score = 0;

let highScore =
    Number(
        localStorage.getItem("racerHighScore")
    ) || 0;

let gameRunning = false;

let gameOver = false;

let gameLoop;

let roadOffset = 0;

let trafficTimer = 0;


/* =========================
   HIGH SCORE
========================= */

document.getElementById("highScore")
    .textContent = highScore;



/* =========================
   START
========================= */

function startGame() {

    if (gameRunning) {
        return;
    }

    if (gameOver) {
        restartGame();
    }

    gameRunning = true;

    gameOver = false;

    document.getElementById("message")
        .textContent =
        "Dodge the cars!";

    gameLoop =
        requestAnimationFrame(updateGame);

}



/* =========================
   RESTART
========================= */

function restartGame() {

    cancelAnimationFrame(gameLoop);

    player.x = 220;

    player.y = 590;

    traffic = [];

    score = 0;

    roadOffset = 0;

    trafficTimer = 0;

    gameRunning = false;

    gameOver = false;

    document.getElementById("score")
        .textContent = "0";

    document.getElementById("message")
        .textContent =
        "Press Start Game or use A/D or Arrow Keys.";

    drawGame();

}



/* =========================
   UPDATE
========================= */

function updateGame() {

    if (!gameRunning) {
        return;
    }


    /* ROAD MOVEMENT */

    roadOffset += 8;

    if (roadOffset >= 60) {
        roadOffset = 0;
    }


    /* TRAFFIC TIMER */

    trafficTimer++;


    if (trafficTimer > 45) {

        createTraffic();

        trafficTimer = 0;

    }


    /* MOVE TRAFFIC */

    traffic.forEach(car => {

        car.y += car.speed;

    });


    /* REMOVE OLD CARS */

    traffic =
        traffic.filter(
            car => car.y < canvas.height + 100
        );


    /* COLLISION */

    for (let car of traffic) {

        if (
            player.x <
                car.x + car.width &&

            player.x + player.width >
                car.x &&

            player.y <
                car.y + car.height &&

            player.y + player.height >
                car.y
        ) {

            endGame();

            return;

        }

    }


    /* SCORE */

    score += 0.1;

    let displayScore =
        Math.floor(score);

    document.getElementById("score")
        .textContent =
        displayScore;


    /* HIGH SCORE */

    if (displayScore > highScore) {

        highScore =
            displayScore;

        localStorage.setItem(
            "racerHighScore",
            highScore
        );

        document.getElementById("highScore")
            .textContent =
            highScore;

    }


    /* DRAW */

    drawGame();


    gameLoop =
        requestAnimationFrame(updateGame);

}



/* =========================
   CREATE TRAFFIC
========================= */

function createTraffic() {

    const lane =
        Math.floor(
            Math.random() * 3
        );

    const x =
        roadLeft +
        lane * laneWidth +
        (laneWidth - 45) / 2;


    const colors = [
        "#ef4444",
        "#3b82f6",
        "#22c55e",
        "#eab308",
        "#ec4899",
        "#f97316"
    ];


    traffic.push({

        x: x,

        y: -100,

        width: 45,

        height: 75,

        speed:
            5 +
            Math.random() * 2,

        color:
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ]

    });

}



/* =========================
   DRAW GAME
========================= */

function drawGame() {


    /* BACKGROUND */

    ctx.fillStyle = "#111";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* GRASS */

    ctx.fillStyle = "#172217";

    ctx.fillRect(
        0,
        0,
        roadLeft,
        canvas.height
    );

    ctx.fillRect(
        roadRight,
        0,
        canvas.width - roadRight,
        canvas.height
    );


    /* ROAD */

    ctx.fillStyle = "#292929";

    ctx.fillRect(
        roadLeft,
        0,
        roadWidth,
        canvas.height
    );


    /* ROAD EDGES */

    ctx.fillStyle = "#ddd";

    ctx.fillRect(
        roadLeft,
        0,
        5,
        canvas.height
    );

    ctx.fillRect(
        roadRight - 5,
        0,
        5,
        canvas.height
    );


    /* LANE LINES */

    ctx.fillStyle = "#eee";

    for (
        let y = -60 + roadOffset;
        y < canvas.height;
        y += 60
    ) {

        ctx.fillRect(

            roadLeft + laneWidth - 2,

            y,

            4,

            30

        );


        ctx.fillRect(

            roadLeft +
                laneWidth * 2 -
                2,

            y,

            4,

            30

        );

    }


    /* TRAFFIC */

    traffic.forEach(
        car => drawCar(
            car.x,
            car.y,
            car.color
        )
    );


    /* PLAYER */

    drawCar(
        player.x,
        player.y,
        "#8b5cf6"
    );

}



/* =========================
   DRAW CAR
========================= */

function drawCar(x, y, color) {

    /* BODY */

    ctx.fillStyle = color;

    ctx.fillRect(
        x,
        y,
        45,
        75
    );


    /* WINDOWS */

    ctx.fillStyle = "#111";

    ctx.fillRect(
        x + 8,
        y + 10,
        29,
        20
    );


    ctx.fillRect(
        x + 8,
        y + 45,
        29,
        15
    );


    /* LIGHTS */

    ctx.fillStyle = "#fff";

    ctx.fillRect(
        x + 5,
        y + 3,
        8,
        5
    );

    ctx.fillRect(
        x + 32,
        y + 3,
        8,
        5
    );


    /* WHEELS */

    ctx.fillStyle = "#050505";

    ctx.fillRect(
        x - 4,
        y + 12,
        6,
        18
    );

    ctx.fillRect(
        x + 43,
        y + 12,
        6,
        18
    );

    ctx.fillRect(
        x - 4,
        y + 48,
        6,
        18
    );

    ctx.fillRect(
        x + 43,
        y + 48,
        6,
        18
    );

}



/* =========================
   MOVE LEFT
========================= */

function moveLeft() {

    if (!gameRunning) {
        return;
    }

    player.x -= player.speed;

    if (
        player.x < roadLeft + 8
    ) {

        player.x =
            roadLeft + 8;

    }

}



/* =========================
   MOVE RIGHT
========================= */

function moveRight() {

    if (!gameRunning) {
        return;
    }

    player.x += player.speed;

    if (
        player.x + player.width >
        roadRight - 8
    ) {

        player.x =
            roadRight -
            player.width -
            8;

    }

}



/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "ArrowLeft" ||
            event.key.toLowerCase() === "a"
        ) {

            event.preventDefault();

            moveLeft();

        }


        if (
            event.key === "ArrowRight" ||
            event.key.toLowerCase() === "d"
        ) {

            event.preventDefault();

            moveRight();

        }


        if (
            event.code === "Space"
        ) {

            event.preventDefault();

            startGame();

        }

    }
);



/* =========================
   GAME OVER
========================= */

function endGame() {

    gameRunning = false;

    gameOver = true;

    cancelAnimationFrame(gameLoop);


    document.getElementById("message")
        .textContent =
        "💥 Game Over! Press Restart to try again.";

}



/* =========================
   INITIALIZE
========================= */

restartGame();

</script>


</body>

</html>
