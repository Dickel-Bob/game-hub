<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Snake</title>

<style>
body {
    margin: 0;
    background: #09090c;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin-top: 25px;
}

p {
    color: #999;
}

canvas {
    background: #111116;
    border: 1px solid #333;
    max-width: 90vw;
}

button {
    margin-top: 15px;
    padding: 10px 18px;
    background: #8b5cf6;
    color: white;
    border: none;
    border-radius: 7px;
    cursor: pointer;
}
</style>
</head>

<body>

<h1>🐍 Neon Snake</h1>

<p>Use the arrow keys to move.</p>

<canvas id="game" width="500" height="500"></canvas>

<br>

<button onclick="location.href='../../'">
← Back to Game Hub
</button>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const size = 20;
const grid = 25;

let snake = [
    {x: 12, y: 12}
];

let direction = {
    x: 1,
    y: 0
};

let nextDirection = direction;

let food = createFood();

let score = 0;
let running = true;


function createFood() {

    let position;

    do {

        position = {
            x: Math.floor(Math.random() * grid),
            y: Math.floor(Math.random() * grid)
        };

    } while (
        snake.some(
            part =>
            part.x === position.x &&
            part.y === position.y
        )
    );

    return position;
}


document.addEventListener("keydown", function(event) {

    if (
        event.key === "ArrowUp" &&
        direction.y !== 1
    ) {
        nextDirection = {x: 0, y: -1};
    }

    if (
        event.key === "ArrowDown" &&
        direction.y !== -1
    ) {
        nextDirection = {x: 0, y: 1};
    }

    if (
        event.key === "ArrowLeft" &&
        direction.x !== 1
    ) {
        nextDirection = {x: -1, y: 0};
    }

    if (
        event.key === "ArrowRight" &&
        direction.x !== -1
    ) {
        nextDirection = {x: 1, y: 0};
    }

});


function update() {

    if (!running) return;

    direction = nextDirection;

    const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
    };


    if (
        head.x < 0 ||
        head.y < 0 ||
        head.x >= grid ||
        head.y >= grid
    ) {

        gameOver();
        return;
    }


    if (
        snake.some(
            part =>
            part.x === head.x &&
            part.y === head.y
        )
    ) {

        gameOver();
        return;
    }


    snake.unshift(head);


    if (
        head.x === food.x &&
        head.y === food.y
    ) {

        score++;

        food = createFood();

    } else {

        snake.pop();

    }


    draw();

    setTimeout(update, 90);
}


function gameOver() {

    running = false;

    draw();

    setTimeout(function() {

        alert("Game Over! Score: " + score);

    }, 100);

}


function draw() {

    ctx.fillStyle = "#111116";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.fillStyle = "#8b5cf6";

    snake.forEach(function(part) {

        ctx.fillRect(
            part.x * size + 2,
            part.y * size + 2,
            size - 4,
            size - 4
        );

    });


    ctx.fillStyle = "white";

    ctx.beginPath();

    ctx.arc(
        food.x * size + 10,
        food.y * size + 10,
        7,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.fillStyle = "white";

    ctx.font = "16px Arial";

    ctx.fillText(
        "Score: " + score,
        10,
        20
    );
}


draw();
update();

</script>

</body>
</html>
