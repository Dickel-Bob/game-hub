<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Neon Snake</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #09090c;
    color: white;
    min-height: 100vh;
}


/* NAVBAR */

.navbar {
    height: 70px;
    background: #111116;
    border-bottom: 1px solid #292930;

    display: flex;
    align-items: center;

    padding: 0 30px;
}

.logo {
    font-size: 23px;
    font-weight: bold;
}

.logo span {
    color: #8b5cf6;
}

.home-button {
    margin-left: auto;

    background: #202027;
    border: 1px solid #35353d;

    color: white;

    padding: 10px 18px;

    border-radius: 7px;

    cursor: pointer;

    font-size: 14px;
}

.home-button:hover {
    background: #8b5cf6;
}


/* GAME AREA */

.container {
    max-width: 700px;
    margin: auto;

    padding: 35px 20px;

    text-align: center;
}

h1 {
    font-size: 36px;
    margin-bottom: 8px;
}

.subtitle {
    color: #888;
    margin-bottom: 20px;
}


/* SCORE */

.score-box {
    display: flex;
    justify-content: center;
    gap: 30px;

    margin-bottom: 20px;
}

.score {
    background: #15151b;

    border: 1px solid #292930;

    border-radius: 8px;

    padding: 10px 20px;

    min-width: 120px;
}

.score-title {
    color: #777;
    font-size: 12px;
}

.score-number {
    font-size: 22px;
    font-weight: bold;
}


/* CANVAS */

.game-wrapper {
    display: flex;
    justify-content: center;
}

canvas {
    background: #0d0d12;

    border: 2px solid #292930;

    border-radius: 10px;

    max-width: 100%;

    box-shadow:
        0 0 30px rgba(139, 92, 246, 0.12);
}


/* BUTTONS */

.controls {
    margin-top: 20px;

    display: flex;

    justify-content: center;

    gap: 10px;
}

button {
    font-family: Arial, Helvetica, sans-serif;
}

.control-button {
    background: #202027;

    border: 1px solid #35353d;

    color: white;

    padding: 10px 18px;

    border-radius: 7px;

    cursor: pointer;
}

.control-button:hover {
    background: #8b5cf6;
}


/* MESSAGE */

.message {
    margin-top: 20px;

    color: #aaa;

    min-height: 25px;
}


/* MOBILE CONTROLS */

.mobile-controls {
    display: none;

    margin: 20px auto 0;

    width: 180px;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 7px;
}

.mobile-controls button {
    height: 50px;

    background: #202027;

    color: white;

    border: 1px solid #35353d;

    border-radius: 7px;

    font-size: 20px;

    cursor: pointer;
}

.mobile-controls button:hover {
    background: #8b5cf6;
}

.up {
    grid-column: 2;
}

.left {
    grid-column: 1;
}

.down {
    grid-column: 2;
}

.right {
    grid-column: 3;
}


/* MOBILE */

@media (max-width: 600px) {

    .navbar {
        padding: 0 15px;
    }

    h1 {
        font-size: 30px;
    }

    canvas {
        width: 100%;
        height: auto;
    }

    .mobile-controls {
        display: grid;
    }

}

</style>

</head>


<body>


<!-- NAVBAR -->

<nav class="navbar">

    <div class="logo">
        🎮 <span>Game</span> Hub
    </div>

    <button
        class="home-button"
        onclick="goHome()"
    >
        ← Game Hub
    </button>

</nav>



<!-- GAME -->

<main class="container">

    <h1>
        🐍 Neon Snake
    </h1>

    <p class="subtitle">
        Eat the food and beat your high score.
    </p>


    <!-- SCORE -->

    <div class="score-box">

        <div class="score">

            <div class="score-title">
                SCORE
            </div>

            <div
                class="score-number"
                id="score"
            >
                0
            </div>

        </div>


        <div class="score">

            <div class="score-title">
                HIGH SCORE
            </div>

            <div
                class="score-number"
                id="highScore"
            >
                0
            </div>

        </div>

    </div>


    <!-- CANVAS -->

    <div class="game-wrapper">

        <canvas
            id="gameCanvas"
            width="500"
            height="500"
        ></canvas>

    </div>


    <!-- BUTTONS -->

    <div class="controls">

        <button
            class="control-button"
            onclick="startGame()"
        >
            Start Game
        </button>

        <button
            class="control-button"
            onclick="restartGame()"
        >
            Restart
        </button>

    </div>


    <div
        class="message"
        id="message"
    >
        Press Start Game or use the arrow keys.
    </div>


    <!-- MOBILE CONTROLS -->

    <div class="mobile-controls">

        <button
            class="up"
            onclick="changeDirection('up')"
        >
            ▲
        </button>

        <button
            class="left"
            onclick="changeDirection('left')"
        >
            ◀
        </button>

        <button
            class="down"
            onclick="changeDirection('down')"
        >
            ▼
        </button>

        <button
            class="right"
            onclick="changeDirection('right')"
        >
            ▶
        </button>

    </div>


</main>



<script>


/* =========================
   GAME HUB BUTTON
========================= */

function goHome() {

    window.location.href =
        "https://game-hub.jakejmanz.workers.dev/";

}



/* =========================
   CANVAS
========================= */

const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");


/* =========================
   GAME SETTINGS
========================= */

const gridSize = 25;

const tileCount =
    canvas.width / gridSize;


/* =========================
   GAME VARIABLES
========================= */

let snake;

let food;

let direction;

let nextDirection;

let score = 0;

let highScore =
    Number(
        localStorage.getItem("snakeHighScore")
    ) || 0;

let gameRunning = false;

let gameOver = false;

let gameLoop;



/* =========================
   HIGH SCORE
========================= */

document.getElementById("highScore")
    .textContent = highScore;



/* =========================
   START GAME
========================= */

function startGame() {

    if (gameRunning) {
        return;
    }

    if (gameOver) {
        restartGame();
        return;
    }

    gameRunning = true;

    document.getElementById("message")
        .textContent =
        "Use the arrow keys to move.";

    gameLoop =
        setInterval(updateGame, 100);

}



/* =========================
   RESTART
========================= */

function restartGame() {

    clearInterval(gameLoop);

    score = 0;

    document.getElementById("score")
        .textContent = score;

    snake = [

        {
            x: 10,
            y: 10
        },

        {
            x: 9,
            y: 10
        },

        {
            x: 8,
            y: 10
        }

    ];

    direction = "right";

    nextDirection = "right";

    gameOver = false;

    gameRunning = false;

    createFood();

    drawGame();

    document.getElementById("message")
        .textContent =
        "Press Start Game or use the arrow keys.";

}



/* =========================
   UPDATE GAME
========================= */

function updateGame() {

    direction =
        nextDirection;


    const head = {

        x: snake[0].x,

        y: snake[0].y

    };


    if (direction === "up") {
        head.y--;
    }

    if (direction === "down") {
        head.y++;
    }

    if (direction === "left") {
        head.x--;
    }

    if (direction === "right") {
        head.x++;
    }


    /* WALL COLLISION */

    if (

        head.x < 0 ||

        head.x >= tileCount ||

        head.y < 0 ||

        head.y >= tileCount

    ) {

        endGame();

        return;

    }


    /* SELF COLLISION */

    for (
        let i = 0;
        i < snake.length;
        i++
    ) {

        if (

            head.x === snake[i].x &&

            head.y === snake[i].y

        ) {

            endGame();

            return;

        }

    }


    snake.unshift(head);


    /* FOOD */

    if (

        head.x === food.x &&

        head.y === food.y

    ) {

        score++;

        document.getElementById("score")
            .textContent = score;


        if (score > highScore) {

            highScore = score;

            localStorage.setItem(
                "snakeHighScore",
                highScore
            );

            document.getElementById("highScore")
                .textContent = highScore;

        }


        createFood();

    }

    else {

        snake.pop();

    }


    drawGame();

}



/* =========================
   CREATE FOOD
========================= */

function createFood() {

    let valid = false;


    while (!valid) {

        food = {

            x:
                Math.floor(
                    Math.random() *
                    tileCount
                ),

            y:
                Math.floor(
                    Math.random() *
                    tileCount
                )

        };


        valid = true;


        for (
            let i = 0;
            i < snake.length;
            i++
        ) {

            if (

                food.x === snake[i].x &&

                food.y === snake[i].y

            ) {

                valid = false;

                break;

            }

        }

    }

}



/* =========================
   DRAW GAME
========================= */

function drawGame() {


    /* BACKGROUND */

    ctx.fillStyle = "#0d0d12";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* GRID */

    ctx.strokeStyle =
        "rgba(255,255,255,0.025)";

    ctx.lineWidth = 1;


    for (
        let i = 0;
        i <= tileCount;
        i++
    ) {

        ctx.beginPath();

        ctx.moveTo(
            i * gridSize,
            0
        );

        ctx.lineTo(
            i * gridSize,
            canvas.height
        );

        ctx.stroke();


        ctx.beginPath();

        ctx.moveTo(
            0,
            i * gridSize
        );

        ctx.lineTo(
            canvas.width,
            i * gridSize
        );

        ctx.stroke();

    }


    /* FOOD */

    ctx.fillStyle = "#ef4444";

    ctx.beginPath();

    ctx.arc(

        food.x * gridSize +
            gridSize / 2,

        food.y * gridSize +
            gridSize / 2,

        gridSize / 2 - 3,

        0,

        Math.PI * 2

    );

    ctx.fill();


    /* SNAKE */

    snake.forEach(
        function(segment, index) {

            if (index === 0) {

                ctx.fillStyle =
                    "#8b5cf6";

            }

            else {

                ctx.fillStyle =
                    "#6d3fd1";

            }


            ctx.fillRect(

                segment.x *
                    gridSize + 2,

                segment.y *
                    gridSize + 2,

                gridSize - 4,

                gridSize - 4

            );

        }
    );

}



/* =========================
   CHANGE DIRECTION
========================= */

function changeDirection(newDirection) {


    if (

        newDirection === "up" &&

        direction !== "down"

    ) {

        nextDirection = "up";

    }


    if (

        newDirection === "down" &&

        direction !== "up"

    ) {

        nextDirection = "down";

    }


    if (

        newDirection === "left" &&

        direction !== "right"

    ) {

        nextDirection = "left";

    }


    if (

        newDirection === "right" &&

        direction !== "left"

    ) {

        nextDirection = "right";

    }

}



/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    function(event) {


        if (
            event.key === "ArrowUp"
        ) {

            event.preventDefault();

            changeDirection("up");

        }


        if (
            event.key === "ArrowDown"
        ) {

            event.preventDefault();

            changeDirection("down");

        }


        if (
            event.key === "ArrowLeft"
        ) {

            event.preventDefault();

            changeDirection("left");

        }


        if (
            event.key === "ArrowRight"
        ) {

            event.preventDefault();

            changeDirection("right");

        }


        /* SPACE = START */

        if (
            event.code === "Space"
        ) {

            event.preventDefault();

            startGame();

        }

    }
);



/* =========================
   GAME OVER
========================= */

function endGame() {

    clearInterval(gameLoop);

    gameRunning = false;

    gameOver = true;


    document.getElementById("message")
        .textContent =
        "Game Over! Press Restart to play again.";

}



/* =========================
   INITIAL GAME
========================= */

restartGame();

</script>


</body>

</html>
