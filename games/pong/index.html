<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Neon Pong</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #09090c;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin-top: 20px;
    margin-bottom: 5px;
}

p {
    color: #999;
}

#game {
    background: #111116;
    border: 2px solid #333;
    border-radius: 10px;
    max-width: 95vw;
}

.score {
    font-size: 28px;
    margin: 12px;
}

.difficulty {
    margin: 15px;
}

.difficulty button {
    margin: 5px;
    padding: 10px 18px;

    border: 1px solid #444;
    border-radius: 7px;

    background: #18181f;
    color: white;

    cursor: pointer;
}

.difficulty button:hover,
.difficulty button.selected {
    background: #8b5cf6;
    border-color: #8b5cf6;
}

.controls button {
    margin: 8px;

    padding: 11px 18px;

    border: none;
    border-radius: 7px;

    background: #8b5cf6;
    color: white;

    font-weight: bold;

    cursor: pointer;
}

.controls button:hover {
    background: #7446d8;
}

#message {
    min-height: 25px;
    color: #aaa;
    margin: 10px;
}

</style>

</head>


<body>


<h1>🏓 Neon Pong</h1>

<p>
Use W/S or the arrow keys to move your paddle.
</p>


<div class="difficulty">

    <strong>Difficulty:</strong>

    <button
        id="easy"
        onclick="setDifficulty('easy')"
    >
        Easy
    </button>

    <button
        id="normal"
        class="selected"
        onclick="setDifficulty('normal')"
    >
        Normal
    </button>

    <button
        id="hard"
        onclick="setDifficulty('hard')"
    >
        Hard
    </button>

</div>


<div class="score">

    <span id="playerScore">
        0
    </span>

    &nbsp;&nbsp; - &nbsp;&nbsp;

    <span id="computerScore">
        0
    </span>

</div>


<canvas
    id="game"
    width="800"
    height="500">
</canvas>


<div id="message">
    Choose a difficulty and press Start.
</div>


<div class="controls">

    <button onclick="startGame()">
        Start Game
    </button>

    <button onclick="restartGame()">
        Restart
    </button>

    <button onclick="goHome()">
        ← Game Hub
    </button>

</div>



<script>


const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


/* PLAYER */

const player = {

    x: 30,

    y: 200,

    width: 12,

    height: 100,

    speed: 7

};


/* COMPUTER */

const computer = {

    x: 758,

    y: 200,

    width: 12,

    height: 100,

    speed: 3.5

};


/* BALL */

const ball = {

    x: 400,

    y: 250,

    size: 12,

    speedX: 5,

    speedY: 2.5

};


let playerScore = 0;

let computerScore = 0;

let keys = {};

let gameRunning = false;

let difficulty = "normal";

let aiReaction = 0;



/* DIFFICULTY SETTINGS */

const difficulties = {

    easy: {

        aiSpeed: 2.6,

        reaction: 0.18,

        ballSpeed: 4.5

    },

    normal: {

        aiSpeed: 3.6,

        reaction: 0.35,

        ballSpeed: 5

    },

    hard: {

        aiSpeed: 5,

        reaction: 0.65,

        ballSpeed: 6

    }

};



/* KEYBOARD */

document.addEventListener(
    "keydown",
    function(event) {

        keys[event.key.toLowerCase()] = true;

        if (
            event.key === "ArrowUp" ||
            event.key === "ArrowDown"
        ) {

            event.preventDefault();

        }

    }
);


document.addEventListener(
    "keyup",
    function(event) {

        keys[event.key.toLowerCase()] = false;

    }
);



/* CHOOSE DIFFICULTY */

function setDifficulty(level) {

    difficulty = level;


    document
        .querySelectorAll(".difficulty button")
        .forEach(button => {

            button.classList.remove(
                "selected"
            );

        });


    document
        .getElementById(level)
        .classList.add("selected");


    document.getElementById(
        "message"
    ).textContent =
        level.charAt(0).toUpperCase() +
        level.slice(1) +
        " difficulty selected.";

}



/* RESET BALL */

function resetBall(direction) {

    ball.x = 400;

    ball.y = 250;


    const settings =
        difficulties[difficulty];


    ball.speedX =
        settings.ballSpeed *
        direction;


    ball.speedY =
        (Math.random() * 5) - 2.5;

}



/* START GAME */

function startGame() {

    playerScore = 0;

    computerScore = 0;

    player.y = 200;

    computer.y = 200;

    gameRunning = true;

    updateScore();

    document.getElementById(
        "message"
    ).textContent =
        "First to 5 wins!";


    resetBall(
        Math.random() > 0.5
            ? 1
            : -1
    );


    requestAnimationFrame(
        gameLoop
    );

}



/* GAME LOOP */

function gameLoop() {

    if (!gameRunning) {

        draw();

        return;

    }


    update();

    draw();

    requestAnimationFrame(
        gameLoop
    );

}



/* UPDATE */

function update() {


    const settings =
        difficulties[difficulty];


    /* PLAYER */

    if (
        keys["w"] ||
        keys["arrowup"]
    ) {

        player.y -=
            player.speed;

    }


    if (
        keys["s"] ||
        keys["arrowdown"]
    ) {

        player.y +=
            player.speed;

    }


    /* PLAYER BOUNDARIES */

    if (player.y < 0) {

        player.y = 0;

    }


    if (
        player.y +
        player.height >
        canvas.height
    ) {

        player.y =
            canvas.height -
            player.height;

    }


    /* COMPUTER AI */

    const target =
        ball.y -
        computer.height / 2;


    const difference =
        target - computer.y;


    /*
       Reaction makes the AI
       deliberately imperfect.
    */

    aiReaction +=
        settings.reaction;


    if (aiReaction >= 1) {

        aiReaction = 0;


        if (
            Math.abs(difference) >
            10
        ) {

            if (difference > 0) {

                computer.y +=
                    settings.aiSpeed;

            }

            else {

                computer.y -=
                    settings.aiSpeed;

            }

        }

    }


    /* COMPUTER BOUNDARIES */

    if (computer.y < 0) {

        computer.y = 0;

    }


    if (
        computer.y +
        computer.height >
        canvas.height
    ) {

        computer.y =
            canvas.height -
            computer.height;

    }


    /* BALL */

    ball.x +=
        ball.speedX;

    ball.y +=
        ball.speedY;


    /* TOP AND BOTTOM */

    if (
        ball.y <= 0 ||
        ball.y +
        ball.size >=
        canvas.height
    ) {

        ball.speedY *= -1;

    }


    /* PLAYER COLLISION */

    if (

        ball.x <=
        player.x +
        player.width &&

        ball.x +
        ball.size >=
        player.x &&

        ball.y +
        ball.size >=
        player.y &&

        ball.y <=
        player.y +
        player.height

    ) {

        ball.speedX =
            Math.abs(ball.speedX) + 0.15;


        const hitPosition =
            (
                ball.y +
                ball.size / 2
            ) -
            (
                player.y +
                player.height / 2
            );


        ball.speedY =
            hitPosition * 0.08;

    }


    /* COMPUTER COLLISION */

    if (

        ball.x +
        ball.size >=
        computer.x &&

        ball.x <=
        computer.x +
        computer.width &&

        ball.y +
        ball.size >=
        computer.y &&

        ball.y <=
        computer.y +
        computer.height

    ) {

        ball.speedX =
            -Math.abs(ball.speedX) - 0.15;


        const hitPosition =
            (
                ball.y +
                ball.size / 2
            ) -
            (
                computer.y +
                computer.height / 2
            );


        ball.speedY =
            hitPosition * 0.08;

    }


    /* COMPUTER SCORES */

    if (ball.x < 0) {

        computerScore++;

        updateScore();

        resetBall(1);

    }


    /* PLAYER SCORES */

    if (
        ball.x >
        canvas.width
    ) {

        playerScore++;

        updateScore();

        resetBall(-1);

    }


    /* WIN */

    if (
        playerScore >= 5 ||
        computerScore >= 5
    ) {

        gameRunning = false;


        if (
            playerScore >
            computerScore
        ) {

            document.getElementById(
                "message"
            ).textContent =
                "🏆 YOU WIN!";

        }

        else {

            document.getElementById(
                "message"
            ).textContent =
                "🤖 Computer wins!";

        }

    }

}



/* DRAW */

function draw() {


    /* BACKGROUND */

    ctx.fillStyle =
        "#111116";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* CENTER LINE */

    ctx.strokeStyle =
        "#333";

    ctx.setLineDash(
        [10, 10]
    );

    ctx.beginPath();

    ctx.moveTo(
        canvas.width / 2,
        0
    );

    ctx.lineTo(
        canvas.width / 2,
        canvas.height
    );

    ctx.stroke();

    ctx.setLineDash([]);


    /* PLAYER */

    ctx.fillStyle =
        "#8b5cf6";

    ctx.fillRect(

        player.x,

        player.y,

        player.width,

        player.height

    );


    /* COMPUTER */

    ctx.fillStyle =
        "#e63946";

    ctx.fillRect(

        computer.x,

        computer.y,

        computer.width,

        computer.height

    );


    /* BALL */

    ctx.fillStyle =
        "white";

    ctx.fillRect(

        ball.x,

        ball.y,

        ball.size,

        ball.size

    );

}



/* SCORE */

function updateScore() {

    document.getElementById(
        "playerScore"
    ).textContent =
        playerScore;


    document.getElementById(
        "computerScore"
    ).textContent =
        computerScore;

}



/* RESTART */

function restartGame() {

    gameRunning = false;

    playerScore = 0;

    computerScore = 0;

    player.y = 200;

    computer.y = 200;

    updateScore();

    resetBall(1);


    document.getElementById(
        "message"
    ).textContent =
        "Press Start Game.";


    draw();

}



/* HOME */

function goHome() {

    window.location.href =
        "/game-hub/";

}



/* INITIAL DRAW */

draw();

</script>


</body>

</html>
