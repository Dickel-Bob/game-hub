<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Neon Snake</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #09090c;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin-top: 25px;
    font-size: 32px;
}

p {
    color: #999;
}

#game {
    background: #111116;
    border: 2px solid #333;
    border-radius: 10px;

    width: 500px;
    height: 500px;

    max-width: 90vw;
    max-height: 90vw;
}

.info {
    margin-top: 15px;
    font-size: 18px;
}

button {
    margin-top: 20px;

    background: #8b5cf6;
    color: white;

    border: none;

    padding: 12px 20px;

    border-radius: 8px;

    cursor: pointer;

    font-weight: bold;
}

button:hover {
    background: #7446d8;
}

</style>

</head>


<body>


<h1>🐍 Neon Snake</h1>

<p>
Use the arrow keys to move the snake.
</p>


<canvas
    id="game"
    width="500"
    height="500">
</canvas>


<div class="info">

    Score:
    <span id="score">
        0
    </span>

</div>


<button onclick="goHome()">
    ← Back to Game Hub
</button>



<script>


const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


const gridSize = 25;

const tileSize = 20;


let snake = [
    {
        x: 12,
        y: 12
    }
];


let direction = {
    x: 1,
    y: 0
};


let nextDirection = {
    x: 1,
    y: 0
};


let food = createFood();


let score = 0;

let gameRunning = true;



/* KEYBOARD CONTROLS */

document.addEventListener(
    "keydown",
    function(event) {


        if (
            event.key === "ArrowUp" &&
            direction.y !== 1
        ) {

            nextDirection = {
                x: 0,
                y: -1
            };

        }


        if (
            event.key === "ArrowDown" &&
            direction.y !== -1
        ) {

            nextDirection = {
                x: 0,
                y: 1
            };

        }


        if (
            event.key === "ArrowLeft" &&
            direction.x !== 1
        ) {

            nextDirection = {
                x: -1,
                y: 0
            };

        }


        if (
            event.key === "ArrowRight" &&
            direction.x !== -1
        ) {

            nextDirection = {
                x: 1,
                y: 0
            };

        }

    }
);



/* CREATE FOOD */

function createFood() {


    let newFood;


    do {

        newFood = {

            x:
                Math.floor(
                    Math.random() *
                    gridSize
                ),

            y:
                Math.floor(
                    Math.random() *
                    gridSize
                )

        };

    } while (

        snake.some(
            part =>
                part.x === newFood.x &&
                part.y === newFood.y
        )

    );


    return newFood;

}



/* GAME UPDATE */

function update() {


    if (!gameRunning) {

        return;

    }


    direction = nextDirection;


    const newHead = {

        x:
            snake[0].x +
            direction.x,

        y:
            snake[0].y +
            direction.y

    };


    /* WALL COLLISION */

    if (

        newHead.x < 0 ||

        newHead.x >= gridSize ||

        newHead.y < 0 ||

        newHead.y >= gridSize

    ) {

        endGame();

        return;

    }


    /* SELF COLLISION */

    if (

        snake.some(

            part =>

                part.x === newHead.x &&
                part.y === newHead.y

        )

    ) {

        endGame();

        return;

    }


    snake.unshift(newHead);


    /* FOOD */

    if (

        newHead.x === food.x &&

        newHead.y === food.y

    ) {

        score++;

        document
            .getElementById("score")
            .textContent = score;

        food = createFood();

    }

    else {

        snake.pop();

    }


    draw();


    setTimeout(
        update,
        90
    );

}



/* DRAW GAME */

function draw() {


    /* BACKGROUND */

    ctx.fillStyle =
        "#111116";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* SNAKE */

    ctx.fillStyle =
        "#8b5cf6";


    snake.forEach(
        function(part) {

            ctx.fillRect(

                part.x *
                    tileSize + 2,

                part.y *
                    tileSize + 2,

                tileSize - 4,

                tileSize - 4

            );

        }
    );


    /* FOOD */

    ctx.fillStyle =
        "white";


    ctx.beginPath();


    ctx.arc(

        food.x *
            tileSize + 10,

        food.y *
            tileSize + 10,

        7,

        0,

        Math.PI * 2

    );


    ctx.fill();

}



/* GAME OVER */

function endGame() {


    gameRunning = false;


    draw();


    setTimeout(

        function() {

            alert(
                "Game Over! Your score was " +
                score
            );

        },

        100

    );

}



/* HOME BUTTON */

function goHome() {

    window.location.href =
        "/game-hub/";

}



/* START */

draw();

update();

</script>


</body>

</html>
