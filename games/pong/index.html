<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Neon Pong</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;

    background: #09090c;

    color: white;

    font-family: Arial, sans-serif;

    text-align: center;
}

h1 {
    margin-top: 20px;
    margin-bottom: 5px;
}

p {
    color: #999;
}

#game {
    background: #111116;

    border: 2px solid #333;

    border-radius: 10px;

    max-width: 95vw;
}

.score {
    font-size: 28px;

    margin: 12px;
}

button {
    margin: 8px;

    padding: 11px 18px;

    border: none;

    border-radius: 7px;

    background: #8b5cf6;

    color: white;

    font-weight: bold;

    cursor: pointer;
}

button:hover {
    background: #7446d8;
}

</style>

</head>


<body>


<h1>🏓 Neon Pong</h1>

<p>
Use W/S or the arrow keys to move your paddle.
</p>


<div class="score">

    <span id="playerScore">0</span>

    &nbsp;&nbsp; - &nbsp;&nbsp;

    <span id="computerScore">0</span>

</div>


<canvas
    id="game"
    width="800"
    height="500">
</canvas>


<br>


<button onclick="restartGame()">
    Restart
</button>


<button onclick="goHome()">
    ← Game Hub
</button>



<script>


const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


/* PLAYER */

const player = {

    x: 30,

    y: 200,

    width: 12,

    height: 100,

    speed: 7

};


/* COMPUTER */

const computer = {

    x: 758,

    y: 200,

    width: 12,

    height: 100,

    speed: 4.5

};


/* BALL */

const ball = {

    x: 400,

    y: 250,

    size: 12,

    speedX: 5,

    speedY: 3

};


let playerScore = 0;

let computerScore = 0;

let keys = {};

let gameRunning = true;



/* KEYBOARD */

document.addEventListener(
    "keydown",
    function(event) {

        keys[event.key.toLowerCase()] = true;

        if (
            event.key === "ArrowUp" ||
            event.key === "ArrowDown"
        ) {

            event.preventDefault();

        }

    }
);


document.addEventListener(
    "keyup",
    function(event) {

        keys[event.key.toLowerCase()] = false;

    }
);



/* RESET BALL */

function resetBall(direction) {

    ball.x = 400;

    ball.y = 250;

    ball.speedX =
        5 * direction;

    ball.speedY =
        (Math.random() * 6) - 3;

}



/* UPDATE */

function update() {


    if (!gameRunning) {

        return;

    }


    /* PLAYER MOVEMENT */

    if (
        keys["w"] ||
        keys["arrowup"]
    ) {

        player.y -=
            player.speed;

    }


    if (
        keys["s"] ||
        keys["arrowdown"]
    ) {

        player.y +=
            player.speed;

    }


    /* KEEP PLAYER ON SCREEN */

    if (player.y < 0) {

        player.y = 0;

    }


    if (
        player.y +
        player.height >
        canvas.height
    ) {

        player.y =
            canvas.height -
            player.height;

    }


    /* COMPUTER AI */

    const computerCenter =
        computer.y +
        computer.height / 2;


    if (
        computerCenter <
        ball.y
    ) {

        computer.y +=
            computer.speed;

    }


    if (
        computerCenter >
        ball.y
    ) {

        computer.y -=
            computer.speed;

    }


    /* KEEP COMPUTER ON SCREEN */

    if (computer.y < 0) {

        computer.y = 0;

    }


    if (
        computer.y +
        computer.height >
        canvas.height
    ) {

        computer.y =
            canvas.height -
            computer.height;

    }


    /* MOVE BALL */

    ball.x +=
        ball.speedX;

    ball.y +=
        ball.speedY;


    /* TOP/BOTTOM */

    if (
        ball.y <= 0 ||
        ball.y + ball.size >=
        canvas.height
    ) {

        ball.speedY *= -1;

    }


    /* PLAYER COLLISION */

    if (

        ball.x <=
        player.x +
        player.width &&

        ball.x +
        ball.size >=
        player.x &&

        ball.y +
        ball.size >=
        player.y &&

        ball.y <=
        player.y +
        player.height

    ) {

        ball.speedX =
            Math.abs(ball.speedX) + 0.2;

        const hitPosition =
            (
                ball.y +
                ball.size / 2
            ) -
            (
                player.y +
                player.height / 2
            );

        ball.speedY =
            hitPosition * 0.08;

    }


    /* COMPUTER COLLISION */

    if (

        ball.x +
        ball.size >=
        computer.x &&

        ball.x <=
        computer.x +
        computer.width &&

        ball.y +
        ball.size >=
        computer.y &&

        ball.y <=
        computer.y +
        computer.height

    ) {

        ball.speedX =
            -Math.abs(ball.speedX) - 0.2;

        const hitPosition =
            (
                ball.y +
                ball.size / 2
            ) -
            (
                computer.y +
                computer.height / 2
            );

        ball.speedY =
            hitPosition * 0.08;

    }


    /* PLAYER MISSED */

    if (ball.x < 0) {

        computerScore++;

        updateScore();

        resetBall(1);

    }


    /* COMPUTER MISSED */

    if (
        ball.x >
        canvas.width
    ) {

        playerScore++;

        updateScore();

        resetBall(-1);

    }


    /* WIN */

    if (
        playerScore >= 5 ||
        computerScore >= 5
    ) {

        gameRunning = false;

        setTimeout(
            function() {

                if (
                    playerScore >
                    computerScore
                ) {

                    alert(
                        "🏆 You Win!"
                    );

                }

                else {

                    alert(
                        "🤖 Computer Wins!"
                    );

                }

            },
            100
        );

    }


    draw();


    requestAnimationFrame(update);

}



/* DRAW */

function draw() {


    /* BACKGROUND */

    ctx.fillStyle =
        "#111116";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* CENTER LINE */

    ctx.strokeStyle =
        "#333";

    ctx.setLineDash(
        [10, 10]
    );

    ctx.beginPath();

    ctx.moveTo(
        canvas.width / 2,
        0
    );

    ctx.lineTo(
        canvas.width / 2,
        canvas.height
    );

    ctx.stroke();

    ctx.setLineDash([]);


    /* PLAYER */

    ctx.fillStyle =
        "#8b5cf6";

    ctx.fillRect(

        player.x,

        player.y,

        player.width,

        player.height

    );


    /* COMPUTER */

    ctx.fillStyle =
        "#e63946";

    ctx.fillRect(

        computer.x,

        computer.y,

        computer.width,

        computer.height

    );


    /* BALL */

    ctx.fillStyle =
        "white";

    ctx.fillRect(

        ball.x,

        ball.y,

        ball.size,

        ball.size

    );

}



/* SCORE */

function updateScore() {

    document.getElementById(
        "playerScore"
    ).textContent =
        playerScore;


    document.getElementById(
        "computerScore"
    ).textContent =
        computerScore;

}



/* RESTART */

function restartGame() {

    player.y = 200;

    computer.y = 200;

    playerScore = 0;

    computerScore = 0;

    gameRunning = true;

    updateScore();

    resetBall(
        Math.random() > 0.5
            ? 1
            : -1
    );

    update();

}



/* HOME */

function goHome() {

    window.location.href =
        "/game-hub/";

}



/* START */

resetBall(1);

draw();

update();

</script>


</body>

</html>
