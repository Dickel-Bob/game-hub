<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Neon Pong</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #09090c;
    color: white;
    min-height: 100vh;
}


/* NAVBAR */

.navbar {
    height: 70px;

    background: #111116;

    border-bottom: 1px solid #292930;

    display: flex;
    align-items: center;

    padding: 0 30px;
}

.logo {
    font-size: 23px;
    font-weight: bold;
}

.logo span {
    color: #8b5cf6;
}

.home-button {
    margin-left: auto;

    background: #202027;

    border: 1px solid #35353d;

    color: white;

    padding: 10px 18px;

    border-radius: 7px;

    cursor: pointer;

    font-size: 14px;
}

.home-button:hover {
    background: #8b5cf6;
}


/* MAIN */

.container {
    max-width: 850px;

    margin: auto;

    padding: 30px 20px;

    text-align: center;
}

h1 {
    font-size: 36px;

    margin-bottom: 5px;
}

.subtitle {
    color: #888;

    margin-bottom: 20px;
}


/* SCORE */

.score-box {
    display: flex;

    justify-content: center;

    gap: 30px;

    margin-bottom: 20px;
}

.score {
    background: #15151b;

    border: 1px solid #292930;

    border-radius: 8px;

    padding: 10px 25px;

    min-width: 130px;
}

.score-title {
    color: #777;

    font-size: 12px;

    margin-bottom: 3px;
}

.score-number {
    font-size: 25px;

    font-weight: bold;
}


/* DIFFICULTY */

.difficulty {
    margin-bottom: 20px;
}

.difficulty label {
    color: #888;

    margin-right: 8px;
}

select {
    background: #202027;

    color: white;

    border: 1px solid #35353d;

    border-radius: 6px;

    padding: 8px 12px;

    cursor: pointer;
}

select:focus {
    outline: none;

    border-color: #8b5cf6;
}


/* CANVAS */

.game-wrapper {
    display: flex;

    justify-content: center;
}

canvas {
    background: #08080c;

    border: 2px solid #292930;

    border-radius: 10px;

    max-width: 100%;

    box-shadow:
        0 0 30px rgba(139, 92, 246, 0.12);
}


/* BUTTONS */

.controls {
    display: flex;

    justify-content: center;

    gap: 10px;

    margin-top: 20px;
}

.control-button {
    background: #202027;

    border: 1px solid #35353d;

    color: white;

    padding: 10px 20px;

    border-radius: 7px;

    cursor: pointer;
}

.control-button:hover {
    background: #8b5cf6;
}


/* MESSAGE */

.message {
    color: #aaa;

    min-height: 25px;

    margin-top: 15px;
}


/* MOBILE */

@media (max-width: 650px) {

    .navbar {
        padding: 0 15px;
    }

    h1 {
        font-size: 30px;
    }

    canvas {
        width: 100%;

        height: auto;
    }

}

</style>

</head>


<body>


<!-- NAVBAR -->

<nav class="navbar">

    <div class="logo">
        🎮 <span>Game</span> Hub
    </div>

    <button
        class="home-button"
        onclick="goHome()"
    >
        ← Game Hub
    </button>

</nav>



<!-- GAME -->

<main class="container">

    <h1>
        🏓 Neon Pong
    </h1>

    <p class="subtitle">
        Beat the computer and get to 7 points first.
    </p>


    <!-- SCORE -->

    <div class="score-box">

        <div class="score">

            <div class="score-title">
                YOU
            </div>

            <div
                class="score-number"
                id="playerScore"
            >
                0
            </div>

        </div>


        <div class="score">

            <div class="score-title">
                COMPUTER
            </div>

            <div
                class="score-number"
                id="computerScore"
            >
                0
            </div>

        </div>

    </div>


    <!-- DIFFICULTY -->

    <div class="difficulty">

        <label for="difficulty">
            Difficulty:
        </label>

        <select
            id="difficulty"
            onchange="changeDifficulty()"
        >

            <option value="easy">
                Easy
            </option>

            <option value="medium" selected>
                Medium
            </option>

            <option value="hard">
                Hard
            </option>

        </select>

    </div>


    <!-- CANVAS -->

    <div class="game-wrapper">

        <canvas
            id="gameCanvas"
            width="800"
            height="500"
        ></canvas>

    </div>


    <!-- BUTTONS -->

    <div class="controls">

        <button
            class="control-button"
            onclick="startGame()"
        >
            Start Game
        </button>

        <button
            class="control-button"
            onclick="restartGame()"
        >
            Restart
        </button>

    </div>


    <div
        class="message"
        id="message"
    >
        Use W/S or the Arrow Keys to move.
    </div>


</main>



<script>


/* =========================
   GAME HUB BUTTON
========================= */

function goHome() {

    window.location.href =
        "https://game-hub.jakejmanz.workers.dev/";

}



/* =========================
   CANVAS
========================= */

const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");


/* =========================
   GAME SETTINGS
========================= */

const paddleWidth = 12;

const paddleHeight = 90;

const paddleSpeed = 7;

const ballSize = 12;

const winningScore = 7;


/* =========================
   PLAYER
========================= */

let player = {

    x: 25,

    y: canvas.height / 2 -
       paddleHeight / 2,

    width: paddleWidth,

    height: paddleHeight

};


/* =========================
   COMPUTER
========================= */

let computer = {

    x: canvas.width -
       25 -
       paddleWidth,

    y: canvas.height / 2 -
       paddleHeight / 2,

    width: paddleWidth,

    height: paddleHeight

};


/* =========================
   BALL
========================= */

let ball = {

    x: canvas.width / 2,

    y: canvas.height / 2,

    size: ballSize,

    speedX: 6,

    speedY: 4

};


/* =========================
   SCORES
========================= */

let playerScore = 0;

let computerScore = 0;


/* =========================
   GAME VARIABLES
========================= */

let gameRunning = false;

let gameOver = false;

let animation;


/* =========================
   PLAYER MOVEMENT
========================= */

let moveUp = false;

let moveDown = false;


/* =========================
   DIFFICULTY
========================= */

let difficulty = "medium";


function changeDifficulty() {

    difficulty =
        document
        .getElementById("difficulty")
        .value;


    if (!gameRunning) {

        resetBall();

        drawGame();

    }

}



/* =========================
   START GAME
========================= */

function startGame() {

    if (gameRunning) {
        return;
    }

    if (gameOver) {

        restartGame();

    }

    gameRunning = true;

    gameOver = false;

    document
        .getElementById("message")
        .textContent =
        "Beat the computer!";

    animation =
        requestAnimationFrame(
            updateGame
        );

}



/* =========================
   RESTART
========================= */

function restartGame() {

    cancelAnimationFrame(animation);

    playerScore = 0;

    computerScore = 0;

    gameRunning = false;

    gameOver = false;

    player.y =
        canvas.height / 2 -
        paddleHeight / 2;

    computer.y =
        canvas.height / 2 -
        paddleHeight / 2;

    updateScore();

    resetBall();

    document
        .getElementById("message")
        .textContent =
        "Use W/S or the Arrow Keys to move.";

    drawGame();

}



/* =========================
   RESET BALL
========================= */

function resetBall() {

    ball.x =
        canvas.width / 2 -
        ball.size / 2;

    ball.y =
        canvas.height / 2 -
        ball.size / 2;


    const direction =
        Math.random() < 0.5
            ? -1
            : 1;


    ball.speedX =
        6 * direction;

    ball.speedY =
        (Math.random() * 4 - 2);


    if (
        Math.abs(ball.speedY) < 1
    ) {

        ball.speedY =
            ball.speedY < 0
                ? -1.5
                : 1.5;

    }

}



/* =========================
   UPDATE GAME
========================= */

function updateGame() {

    if (!gameRunning) {
        return;
    }


    /* PLAYER */

    if (moveUp) {

        player.y -= paddleSpeed;

    }

    if (moveDown) {

        player.y += paddleSpeed;

    }


    /* PLAYER BOUNDARIES */

    if (player.y < 0) {

        player.y = 0;

    }

    if (
        player.y +
        player.height >
        canvas.height
    ) {

        player.y =
            canvas.height -
            player.height;

    }


    /* COMPUTER */

    let computerSpeed;


    if (difficulty === "easy") {

        computerSpeed = 3.2;

    }

    else if (
        difficulty === "medium"
    ) {

        computerSpeed = 5;

    }

    else {

        computerSpeed = 6.5;

    }


    /* COMPUTER AI */

    const computerCenter =
        computer.y +
        computer.height / 2;


    const ballCenter =
        ball.y +
        ball.size / 2;


    if (
        computerCenter <
        ballCenter - 10
    ) {

        computer.y +=
            computerSpeed;

    }

    else if (
        computerCenter >
        ballCenter + 10
    ) {

        computer.y -=
            computerSpeed;

    }


    /* COMPUTER BOUNDARIES */

    if (computer.y < 0) {

        computer.y = 0;

    }

    if (
        computer.y +
        computer.height >
        canvas.height
    ) {

        computer.y =
            canvas.height -
            computer.height;

    }


    /* BALL */

    ball.x += ball.speedX;

    ball.y += ball.speedY;


    /* TOP / BOTTOM */

    if (
        ball.y <= 0 ||
        ball.y + ball.size >=
        canvas.height
    ) {

        ball.speedY *= -1;

    }


    /* PLAYER COLLISION */

    if (

        ball.x <=
            player.x +
            player.width &&

        ball.x +
            ball.size >=
            player.x &&

        ball.y +
            ball.size >=
            player.y &&

        ball.y <=
            player.y +
            player.height &&

        ball.speedX < 0

    ) {

        ball.x =
            player.x +
            player.width;

        ball.speedX *= -1;


        const hitPosition =
            (
                ball.y +
                ball.size / 2 -
                (
                    player.y +
                    player.height / 2
                )
            ) /
            (
                player.height / 2
            );


        ball.speedY =
            hitPosition * 6;


        increaseBallSpeed();

    }


    /* COMPUTER COLLISION */

    if (

        ball.x +
            ball.size >=
            computer.x &&

        ball.x <=
            computer.x +
            computer.width &&

        ball.y +
            ball.size >=
            computer.y &&

        ball.y <=
            computer.y +
            computer.height &&

        ball.speedX > 0

    ) {

        ball.x =
            computer.x -
            ball.size;

        ball.speedX *= -1;


        const hitPosition =
            (
                ball.y +
                ball.size / 2 -
                (
                    computer.y +
                    computer.height / 2
                )
            ) /
            (
                computer.height / 2
            );


        ball.speedY =
            hitPosition * 6;


        increaseBallSpeed();

    }


    /* LEFT SIDE */

    if (ball.x < -ball.size) {

        computerScore++;

        updateScore();

        checkWinner();

        if (!gameOver) {

            resetBall();

        }

        return;

    }


    /* RIGHT SIDE */

    if (
        ball.x >
        canvas.width
    ) {

        playerScore++;

        updateScore();

        checkWinner();

        if (!gameOver) {

            resetBall();

        }

        return;

    }


    drawGame();


    animation =
        requestAnimationFrame(
            updateGame
        );

}



/* =========================
   SPEED
========================= */

function increaseBallSpeed() {

    const maxSpeed = 11;


    if (
        Math.abs(ball.speedX) <
        maxSpeed
    ) {

        ball.speedX *= 1.04;

    }

}



/* =========================
   SCORE
========================= */

function updateScore() {

    document
        .getElementById("playerScore")
        .textContent =
        playerScore;


    document
        .getElementById("computerScore")
        .textContent =
        computerScore;

}



/* =========================
   WINNER
========================= */

function checkWinner() {

    if (
        playerScore >=
        winningScore
    ) {

        gameOver = true;

        gameRunning = false;

        cancelAnimationFrame(
            animation
        );


        document
            .getElementById("message")
            .textContent =
            "🏆 You Win! Press Restart to play again.";

    }


    if (
        computerScore >=
        winningScore
    ) {

        gameOver = true;

        gameRunning = false;

        cancelAnimationFrame(
            animation
        );


        document
            .getElementById("message")
            .textContent =
            "💀 Computer Wins! Press Restart to try again.";

    }

}



/* =========================
   DRAW GAME
========================= */

function drawGame() {


    /* BACKGROUND */

    ctx.fillStyle =
        "#08080c";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* COURT */

    ctx.strokeStyle =
        "#292930";

    ctx.lineWidth = 2;

    ctx.strokeRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* CENTRE LINE */

    ctx.strokeStyle =
        "#292930";

    ctx.setLineDash([
        10,
        10
    ]);

    ctx.beginPath();

    ctx.moveTo(
        canvas.width / 2,
        0
    );

    ctx.lineTo(
        canvas.width / 2,
        canvas.height
    );

    ctx.stroke();

    ctx.setLineDash([]);


    /* PLAYER */

    ctx.fillStyle =
        "#8b5cf6";

    ctx.fillRect(
        player.x,
        player.y,
        player.width,
        player.height
    );


    /* COMPUTER */

    ctx.fillStyle =
        "#ef4444";

    ctx.fillRect(
        computer.x,
        computer.y,
        computer.width,
        computer.height
    );


    /* BALL */

    ctx.fillStyle =
        "#ffffff";

    ctx.fillRect(
        ball.x,
        ball.y,
        ball.size,
        ball.size
    );

}



/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    function(event) {


        if (
            event.key === "ArrowUp" ||
            event.key.toLowerCase() === "w"
        ) {

            event.preventDefault();

            moveUp = true;

        }


        if (
            event.key === "ArrowDown" ||
            event.key.toLowerCase() === "s"
        ) {

            event.preventDefault();

            moveDown = true;

        }


        if (
            event.code === "Space"
        ) {

            event.preventDefault();

            startGame();

        }

    }
);


document.addEventListener(
    "keyup",
    function(event) {


        if (
            event.key === "ArrowUp" ||
            event.key.toLowerCase() === "w"
        ) {

            moveUp = false;

        }


        if (
            event.key === "ArrowDown" ||
            event.key.toLowerCase() === "s"
        ) {

            moveDown = false;

        }

    }
);



/* =========================
   INITIALIZE
========================= */

restartGame();

</script>


</body>

</html>
