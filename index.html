<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Hub</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0b0b0f;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            background: #111116;
            border-bottom: 1px solid #292930;
            padding: 20px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .search {
            background: #191920;
            border: 1px solid #35353e;
            border-radius: 8px;
            padding: 12px 16px;
            width: 280px;
            color: white;
            outline: none;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 40px 25px;
        }

        .welcome {
            margin-bottom: 30px;
        }

        .welcome h1 {
            font-size: 36px;
            margin-bottom: 8px;
        }

        .welcome p {
            color: #999;
        }

        .categories {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .category {
            background: #18181f;
            border: 1px solid #303039;
            color: white;
            padding: 10px 16px;
            border-radius: 7px;
            cursor: pointer;
        }

        .category:hover {
            background: #25252e;
        }

        .games {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .game {
            background: #15151b;
            border: 1px solid #292930;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: 0.2s;
        }

        .game:hover {
            transform: translateY(-4px);
            border-color: #555;
        }

        .game-image {
            height: 130px;
            background: linear-gradient(135deg, #24242d, #101014);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
        }

        .game-info {
            padding: 15px;
        }

        .game-info h3 {
            margin-bottom: 5px;
        }

        .game-info p {
            color: #888;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            header {
                padding: 15px 20px;
            }

            .search {
                width: 150px;
            }

            .welcome h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">🎮 Game Hub</div>

    <input
        type="text"
        class="search"
        id="search"
        placeholder="Search games..."
        onkeyup="searchGames()"
    >
</header>

<div class="container">

    <div class="welcome">
        <h1>Game Hub</h1>
        <p>Play your favourite browser games.</p>
    </div>

    <div class="categories">
        <button class="category">All Games</button>
        <button class="category">Action</button>
        <button class="category">Arcade</button>
        <button class="category">Racing</button>
        <button class="category">Puzzle</button>
    </div>

    <div class="games" id="games">

        <div class="game">
            <div class="game-image">🏎️</div>
            <div class="game-info">
                <h3>Racing Game</h3>
                <p>Racing</p>
            </div>
        </div>

        <div class="game">
            <div class="game-image">🧟</div>
            <div class="game-info">
                <h3>Zombie Game</h3>
                <p>Action</p>
            </div>
        </div>

        <div class="game">
            <div class="game-image">🧩</div>
            <div class="game-info">
                <h3>Puzzle Game</h3>
                <p>Puzzle</p>
            </div>
        </div>

        <div class="game">
            <div class="game-image">🚀</div>
            <div class="game-info">
                <h3>Space Game</h3>
                <p>Arcade</p>
            </div>
        </div>

    </div>

</div>

<script>
function searchGames() {
    let search = document.getElementById("search").value.toLowerCase();
    let games = document.querySelectorAll(".game");

    games.forEach(game => {
        let name = game.querySelector("h3").textContent.toLowerCase();

        if (name.includes(search)) {
            game.style.display = "";
        } else {
            game.style.display = "none";
        }
    });
}
</script>

</body>
</html>
